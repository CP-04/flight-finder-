name: Daily flight check
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run finder
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python flight_finder.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build web page
        run: python build_page.py
      - name: Save price history
        run: |
          git config user.name "flight-bot"
          git config user.email "bot@users.noreply.github.com"
          git add prices.csv docs/index.html
          git commit -m "Update prices" || exit 0
          git push
